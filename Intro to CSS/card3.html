<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card3</title>
    <link rel="stylesheet" href="style.css">
<body>
    <form action="">
        <div class="card3-box">
            <img src="building-svgrepo-com.svg" alt="building image" class="building">
            <h1>Your Company</h1>
            <p>Tell us about your company. You will be able to invite your teammates in the next step.</p>
            <label for="" class="l">Company name</label><br>
            <input type="text" name="" id="" class="drop-box" required minlength="3" maxlength="50"><br><br>
            <label for="">Industry (optional)</label><br>
            <select name="industry-type" id="" required class="drop-box">
                <option name="industry-type" value="Creative Agency">Creative Agency</option>
                <option name="industry-type" value="Management Consulting Firm">Management Consulting Firm</option>
                <option name="industry-type" value="Market Research Company">Market Research Company</option>
                <option name="industry-type" value="Digital Marketing Agency">Digital Marketing Agency</option>
                <option name="industry-type" value="Public Relations">Public Relations</option>
            </select><br><br>
            <label for="">Your role (optional)</label><br>
            <select name="role-type" id="" required class="drop-box">
                <option name="industry-type" value="Owner / Founder / CEO">Owner / Founder / CEO</option>
                <option name="industry-type" value="President">President</option>
                <option name="industry-type" value="Chief Operating Officer">Chief Operating Officer</option>
                <option name="industry-type" value="Managing Director">Managing Directory</option>
                <option name="industry-type" value="Managing Partner">Managing Partner</option>
            </select><br><br>
            <label for="">Company size (optional)</label><br>
            <select name="company-size" id="" required class="drop-box">
                <option name="company-size" value="2 - 10">2 - 10</option>
                <option name="company-size" value="11- 20">11- 20</option>
                <option name="company-size" value="21 - 30">21 - 30</option>
                <option name="company-size" value="31 - 40">31 - 40</option>
                <option name="company-size" value="41 - 50">41 - 50</option>
            </select><br><br>
            <button type="submit" class="btn-card1">Submit</button>
        </div>
    </form>
</body>
</html>
